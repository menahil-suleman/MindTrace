version: "3.8"

services:
  db:
    # pgvector/pgvector includes the pgvector extension on top of Postgres 16
    # pgvector lets us store and search vectors (embeddings) inside Postgres
    # No separate vector database needed — everything in one place
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: