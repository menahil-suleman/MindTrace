name: mindtrace
description: MindTrace - Clinical Mental Health Systems

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.1

  # Local storage for token persistence
  shared_preferences: ^2.2.3

  # Google Fonts (Manrope)
  google_fonts: ^6.2.1

  # Form validation helpers
  intl: ^0.19.0

  # SHA-256 hashing for crisis-log (never send raw trigger text)
  crypto: ^3.0.3

  # Dialing helpline numbers from the Crisis screen
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
